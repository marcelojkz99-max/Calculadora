<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA_WEB</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
   <header>
<div class="grid_cabeçalho">
    <span class="titulo">
        <span class="letra">C</span>
        <span class="nome">alculadora</span>
    </span>
        <span class="config">configuração</span>
    </div>
   </header>
   <main class="centro">
    <div class="calculadora">
<div>
    <!-- ...TELA SUPERIOR...-->
    <div class="superior">
        <input class="visor" type="text" >
        <div class="limpar"></div>
    </div>
    <!-- ...TECLADO...-->
<div class="teclado">
    <div class="tlc-sup">
        <div class="botao"><p>/</p></div>
        <div class="botao"><p>*</p></div>
        <div class="botao"><p>-</p></div>
        <div class="botao"><p>+</p></div>
    </div>
    <div class="tlc-mid">
        <div class="botao"><p>1</p></div>
        <div class="botao"><p>2</div>
        <div class="botao"><p>3</p></div>
        <div class="botao"><p>4</p></div>
        <div class="botao"><p>5</p></div>
        <div class="botao"><p>6</p></div>
        <div class="botao"><p>7</p></div>
        <div class="botao"><p>8</p></div>
        <div class="botao"><p>9</p></div>
    </div>
    <div class="tlc-inf">
        <div class="botao-0"><p>0</p></div>
    </div>
</div>






</div>

</div>
    </div>
   </main>
</body>
</html>
